name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo & target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Unit tests
        run: cargo test --verbose

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Smoke test (stdio end-to-end)
        run: python scripts/smoke.py target\debug\heisenberg.exe

  release-binary:
    # Sanity-check the optimized static-CRT single binary builds too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Upload heisenberg.exe
        uses: actions/upload-artifact@v6
        with:
          name: heisenberg-exe
          path: target/release/heisenberg.exe
